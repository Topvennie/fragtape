app:
  name: fragtape

server:
  api:
    host: 0.0.0.0
    port: 8000

  auth:
    steam:
      callback_url:

  logger:
    file: server
    level: warn

  db:
    host: db
    port: 5432
    database: fragtape
    user: postgres
    password: postgres

  minio:
    bucket: fragtape
    endpoint: minio:9000
    secure: false
    username: minio
    password: miniominio

worker:
  fetcher:
    interval_s: 300
    cooldown_s: 600

  parser:
    interval_s: 60
    concurrent: 8
    positions_per_second: 4
    positions_min_distance: 10

  finalizer:
    interval_s: 60
    concurrent: 8

  logger:
    file: worker
    level: info

  db:
    host: db
    port: 5432
    database: fragtape
    user: postgres
    password: postgres

  minio:
    bucket: fragtape
    endpoint: minio:9000
    secure: false
    username: minio
    password: miniominio

recorder:
  interval_s: 60
  dummy_data: false
  hlae_path: "C:\\Program Files (x86)\\HLAE"
  cs2_path: "C:\\Program Files (x86)\\Steam\\SteamApps\\common\\Counter-Strike Global Offensive"

  logger:
    file: recorder
    level: info

  db:
    host: db
    port: 5432
    database: fragtape
    user: postgres
    password: postgres

  minio:
    bucket: fragtape
    endpoint: minio:9000
    secure: false
    username: minio
    password: miniominio

service:
  steam:
    url: http://steam
    port: 3002
    api_key:
    username:
    password:
    shared_secret:
  faceit:
    api_key:
